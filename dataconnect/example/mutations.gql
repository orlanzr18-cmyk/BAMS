mutation CrearProducto(
  $nombreProducto: String!
  $descripcionProducto: String
  $precioProducto: Float!
  $codigoBarra: String
) @auth(level: PUBLIC) {
  producto_insert(
    data: {
      nombreProducto: $nombreProducto
      descripcionProducto: $descripcionProducto
      precioProducto: $precioProducto
      codigoBarra: $codigoBarra
    }
  )
}

mutation ActualizarProducto(
  $id: Int!
  $nombreProducto: String!
  $descripcionProducto: String
  $precioProducto: Float!
  $codigoBarra: String
) @auth(level: PUBLIC) {
  producto_update(
    id: $id
    data: {
      nombreProducto: $nombreProducto
      descripcionProducto: $descripcionProducto
      precioProducto: $precioProducto
      codigoBarra: $codigoBarra
    }
  )
}

mutation EliminarProducto($id: Int!) @auth(level: PUBLIC) {
  producto_delete(id: $id)
}

mutation CrearCliente($nombreCliente: String!) @auth(level: PUBLIC) {
  cliente_insert(data: { nombreCliente: $nombreCliente })
}

mutation CrearUsuario($usuario: String!, $correo: String!)
@auth(level: USER) {
  usuario_insert(data: { usuario: $usuario, correo: $correo })
}

mutation CrearInventario($productoId: Int!, $cantidad: Int!)
@auth(level: PUBLIC) {
  inventario_insert(data: { productoId: $productoId, cantidad: $cantidad })
}

mutation AjustarInventario($productoId: Int!, $cantidad: Int!)
@auth(level: PUBLIC) {
  inventario_update(
    first: { where: { producto: { id: { eq: $productoId } } } }
    data: { cantidad: $cantidad }
  )
}

mutation CrearVenta(
  $nombreVenta: String!
  $clienteId: Int!
  $total: Float!
) @auth(level: USER) {
  venta_insert(
    data: {
      nombreVenta: $nombreVenta
      usuarioUid_expr: "auth.uid"
      clienteId: $clienteId
      total: $total
    }
  )
}

mutation AgregarDetalleVenta(
  $ventaId: Int!
  $productoId: Int!
  $cantidad: Int!
  $precioHistorico: Float!
) @auth(level: USER) @transaction {
  detalleVenta_insert(
    data: {
      ventaId: $ventaId
      productoId: $productoId
      cantidad: $cantidad
      precioHistorico: $precioHistorico
    }
  )
  inventario_update(
    first: { where: { producto: { id: { eq: $productoId } } } }
    data: { cantidad_update: { dec: $cantidad } }
  )
}