query ListarProductos @auth(level: PUBLIC) {
  productos(orderBy: { nombreProducto: ASC }) {
    id
    nombreProducto
    descripcionProducto
    precioProducto
    codigoBarra
  }
}

query BuscarProductoPorCodigo($codigoBarra: String!) @auth(level: PUBLIC) {
  productos(where: { codigoBarra: { eq: $codigoBarra } }) {
    id
    nombreProducto
    descripcionProducto
    precioProducto
    codigoBarra
  }
}

query ListarClientes @auth(level: PUBLIC) {
  clientes(orderBy: { nombreCliente: ASC }) {
    id
    nombreCliente
  }
}

query ListarInventario @auth(level: PUBLIC) {
  inventarios {
    id
    cantidad
    producto { id nombreProducto codigoBarra }
  }
}

query ListarVentas @auth(level: PUBLIC) {
  ventas(orderBy: { fecha: DESC }) {
    id
    nombreVenta
    total
    fecha
    usuario { usuario }
    cliente { nombreCliente }
  }
}

query DetalleDeVenta($ventaId: Int!) @auth(level: PUBLIC) {
  detalleVentas(where: { venta: { id: { eq: $ventaId } } }) {
    id
    cantidad
    precioHistorico
    producto { id nombreProducto }
  }
}