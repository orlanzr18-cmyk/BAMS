type Usuario @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  usuario: String!
  correo: String!
}

type Cliente @table(key: "id") {
  id: Int! @col(dataType: "serial")
  nombreCliente: String!
}

type Producto @table(key: "id") {
  id: Int! @col(dataType: "serial")
  nombreProducto: String!
  descripcionProducto: String
  precioProducto: Float!
  codigoBarra: String @unique
}

type Inventario @table(key: "id") {
  id: Int! @col(dataType: "serial")
  producto: Producto! @unique
  cantidad: Int!
}

type Venta @table(key: "id") {
  id: Int! @col(dataType: "serial")
  nombreVenta: String!
  usuario: Usuario!
  cliente: Cliente!
  total: Float!
  fecha: Timestamp! @default(expr: "request.time")
}

type DetalleVenta @table(key: "id") {
  id: Int! @col(dataType: "serial")
  venta: Venta!
  producto: Producto!
  cantidad: Int!
  precioHistorico: Float!
}